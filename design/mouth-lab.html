<script id="mouth">
// ---- The mouth drawing ------------------------------------------------------------------------------------------
// mouth(pose) returns an SVG string. A pose says where things are for one sound:
//   tongue: { tip, blade, body, back, front? }  points [x, y] on the tongue's top surface, front to back
//   jaw: 0 (teeth together) to 1 (wide open)      lips: "rest" | "spread" | "round" | "closed" | "teeth-on-lip" | "open"
//   nose: true when air goes through the nose (the soft palate is down)
//   voice: true for a buzz in the throat           air: "mouth" | "teeth" | "nose" | "puff" | "throat" | null
// The view box is 300 by 300, facing left. Colors come from CSS custom properties, so every look can set them.
const R = (n) => Math.round(n * 10) / 10;
const pt = ([x, y]) => `${R(x)} ${R(y)}`;
function smooth(pts, move = true) {
  let d = move ? `M${pt(pts[0])}` : `L${pt(pts[0])}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${pt(c1)} ${pt(c2)} ${pt(p2)}`;
  }
  return d;
}
const add = ([x, y], [dx, dy]) => [x + dx, y + dy];

function tonguePath(t, jy) {
  // The front moves with the jaw, the back less. The underside runs from the tip back along the floor of the mouth.
  const tip = add(t.tip, [0, jy]), blade = add(t.blade, [0, jy * 0.85]), body = add(t.body, [0, jy * 0.5]), back = add(t.back, [0, jy * 0.25]);
  const front = add(t.front ?? [t.tip[0] + 7, t.tip[1] + 11], [0, jy]);
  const root = [203, 230];
  const under = [root, [172, 216 + jy * 0.3], [132, 200 + jy * 0.6], [106, 186 + jy], front, tip];
  return `${smooth([tip, blade, body, back, root])} ${smooth(under).replace(/^M[^C]*/, "")} Z`;
}

// The lips for each shape: upper { front, edge, inner }, lower { top, inner, front, bottom }. The lower lip moves with the jaw.
const LIPS = {
  rest: (j) => [{ front: [52, 126], edge: [58, 141], inner: [75, 141] }, { top: [58, 147 + j], inner: [76, 147 + j], front: [50, 160 + j], bottom: [62, 176 + j] }],
  open: (j) => [{ front: [52, 125], edge: [58, 139], inner: [75, 139] }, { top: [58, 150 + j], inner: [76, 150 + j], front: [50, 163 + j], bottom: [62, 178 + j] }],
  spread: (j) => [{ front: [57, 127], edge: [62, 140], inner: [76, 140] }, { top: [62, 147 + j], inner: [77, 147 + j], front: [56, 158 + j], bottom: [65, 173 + j] }],
  round: (j) => [{ front: [40, 128], edge: [44, 141], inner: [70, 141] }, { top: [44, 148 + j], inner: [70, 148 + j], front: [38, 160 + j], bottom: [57, 177 + j] }],
  closed: () => [{ front: [52, 127], edge: [57, 145], inner: [75, 145] }, { top: [57, 145], inner: [75, 145], front: [49, 159], bottom: [61, 176] }],
  "teeth-on-lip": () => [{ front: [52, 124], edge: [58, 137], inner: [74, 137] }, { top: [72, 148], inner: [83, 152], front: [60, 160], bottom: [64, 177] }],
};
function lipsPaths(kind, jy) {
  const [up, lo] = (LIPS[kind] ?? LIPS.rest)(jy);
  const upperEdge = `C60 114 ${pt(add(up.front, [2, -8]))} ${pt(up.front)} C${pt(add(up.front, [-1, 8]))} ${pt(add(up.edge, [-5, 0]))} ${pt(up.edge)} C${pt(add(up.edge, [6, 1]))} ${pt(add(up.inner, [-4, 0]))} ${pt(up.inner)}`;
  const lowerEdge = `M${pt(lo.inner)} C${pt(add(lo.inner, [-6, -1]))} ${pt(add(lo.top, [5, 0]))} ${pt(lo.top)} C${pt(add(lo.top, [-6, 1]))} ${pt(add(lo.front, [0, -7]))} ${pt(lo.front)} C${pt(add(lo.front, [0, 8]))} ${pt(add(lo.bottom, [-7, 0]))} ${pt(lo.bottom)}`;
  const chin = `C${pt(add(lo.bottom, [-2, 8]))} 58 ${204 + jy} 66 ${218 + jy} C76 ${232 + jy} 116 ${238 + jy * 0.5} 150 242 C166 248 172 268 176 300`;
  const outline = `M114 0 C102 26 76 54 46 80 C33 91 37 102 57 102 C64 102 68 106 67 112 ${upperEdge} ${lowerEdge} ${chin}`;
  const upper = `M67 112 C60 114 ${pt(add(up.front, [2, -8]))} ${pt(up.front)} C${pt(add(up.front, [-1, 8]))} ${pt(add(up.edge, [-5, 0]))} ${pt(up.edge)} C${pt(add(up.edge, [6, 1]))} ${pt(add(up.inner, [-4, 0]))} ${pt(up.inner)} L77 114 Z`;
  const lower = `M${pt(lo.inner)} C${pt(add(lo.inner, [-6, -1]))} ${pt(add(lo.top, [5, 0]))} ${pt(lo.top)} C${pt(add(lo.top, [-6, 1]))} ${pt(add(lo.front, [0, -7]))} ${pt(lo.front)} C${pt(add(lo.front, [0, 8]))} ${pt(add(lo.bottom, [-7, 0]))} ${pt(lo.bottom)} L${pt(add(lo.bottom, [17, 0]))} L${pt(add(lo.inner, [3, 6]))} Z`;
  return { upper, lower, outline, bottom: lo.bottom };
}

function mouth(pose, { ghost = null, labels = [], arrows = [], idPrefix = "m", crop = "24 58 236 232" } = {}) {
  const jy = (pose.jaw ?? 0.15) * 22;
  const nose = !!pose.nose;
  const skin = `fill="var(--skin)" stroke="var(--skin-line)" stroke-width="2.5" stroke-linejoin="round"`;
  // The head: the face down the left. The lips are drawn on top of it.
  const lips0 = lipsPaths(pose.lips ?? "rest", jy);
  const head = `M300 0 L114 0 C102 26 76 54 46 80 C33 91 37 102 57 102 C64 102 68 106 67 112 L80 116 L82 ${176 + jy} L${pt(lips0.bottom)} C${pt(add(lips0.bottom, [-2, 8]))} 58 ${204 + jy} 66 ${218 + jy} C76 ${232 + jy} 116 ${238 + jy * 0.5} 150 242 C166 248 172 268 176 300 L300 300 Z`;
  // The air inside: nose, mouth, and throat. The roof of the mouth is the strip of head between the nose and the mouth.
  const air = [
    "M57 102 C58 96 62 90 72 86 C100 76 150 70 200 74 C222 77 233 86 235 102 L237 300 L207 300 L205 252",
    `C204 242 200 236 196 232 L170 ${218 + jy * 0.3} C140 ${206 + jy * 0.5} 112 ${194 + jy} 98 ${184 + jy}`,
    `L92 ${178 + jy} L84 ${158 + jy} L64 ${152 + jy} L62 128 L76 110 L94 106`,
    "C98 104 100 101 104 100 C116 96 130 94 150 93 C166 93 178 95 186 98",
    nose ? "C194 104 199 118 197 132 C201 138 208 135 208 126 C208 114 207 102 205 92 C200 90 196 89 190 89"
         : "C200 104 212 108 222 108 C228 108 233 106 235 102 C230 93 214 89 190 89",
    "C160 88 120 90 96 94 C80 97 66 100 57 102 Z",
  ].join(" ");
  const upperTooth = "M78 108 L92 107 C94 118 91 134 84 148 L76 147 C73 136 73 120 78 108 Z";
  const lowerTooth = `M78 ${152 + jy} L85 ${150 + jy} C91 ${160 + jy} 94 ${170 + jy} 94 ${181 + jy} L84 ${181 + jy} C82 ${170 + jy} 78 ${161 + jy} 78 ${152 + jy} Z`;
  const lips = lips0;
  const tongue = tonguePath(pose.tongue, jy);
  const ghostTongue = ghost ? tonguePath(ghost.tongue, (ghost.jaw ?? 0.15) * 22) : "";
  const tip = add(pose.tongue.tip, [0, jy]);
  // Where the air goes: a dotted line with an arrowhead.
  const FLOWS = {
    mouth: `M218 262 C218 210 216 160 200 132 C176 110 126 112 96 132 C84 140 66 146 22 147`,
    teeth: `M218 262 C218 210 216 160 200 132 C176 112 130 116 ${R(tip[0] + 22)} ${R(tip[1] - 9)} C${R(tip[0] + 8)} ${R(tip[1] - 5)} ${R(tip[0] - 2)} ${R(tip[1] - 4)} 22 ${R(tip[1] - 4)}`,
    nose: "M218 262 C218 210 222 150 222 116 C220 96 180 80 120 80 C90 80 64 88 36 96",
    puff: "M46 146 L20 146 M44 136 L22 128 M44 156 L22 164",
    throat: `M218 262 C218 210 216 160 200 132 C176 116 130 120 100 136 C86 143 66 148 22 149`,
  };
  const flow = pose.air ? FLOWS[pose.air] : "";
  const buzz = pose.voice ? '<path d="M209 268 l5 -7 l5 7 l5 -7 l5 7 l5 -7" fill="none" stroke="var(--flow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>' : "";
  const marker = `${idPrefix}-arrow`;
  return `<svg viewBox="${crop}" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="${marker}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--flow)"/></marker></defs>
  <path d="${head}" fill="var(--skin)"/>
  <path d="${air}" fill="var(--air)" stroke="var(--skin-line)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="${lowerTooth}" fill="var(--tooth)" stroke="var(--tooth-line)" stroke-width="2"/>
  ${ghost ? `<path d="${ghostTongue}" fill="none" stroke="var(--ghost)" stroke-width="2.5" stroke-dasharray="5 5" opacity=".6"/>` : ""}
  <path d="${tongue}" fill="var(--tongue)" stroke="var(--tongue-line)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="${upperTooth}" fill="var(--tooth)" stroke="var(--tooth-line)" stroke-width="2"/>
  <path d="${lips.upper}" fill="var(--skin)"/>
  <path d="${lips.lower}" fill="var(--skin)"/>
  <path d="${lips.outline}" fill="none" stroke="var(--skin-line)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${flow ? `<path d="${flow}" fill="none" stroke="var(--flow)" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round" marker-end="url(#${marker})"/>` : ""}
  ${buzz}
  ${arrows.map(([a, b]) => `<path d="M${pt(a)} L${pt(b)}" stroke="var(--flow)" stroke-width="3.5" stroke-linecap="round" marker-end="url(#${marker})"/>`).join("")}
  ${labels.map(([n, [x, y]]) => `<g><circle cx="${x}" cy="${y}" r="11" fill="var(--flow)" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="system-ui, sans-serif">${n}</text></g>`).join("")}
</svg>`;
}
